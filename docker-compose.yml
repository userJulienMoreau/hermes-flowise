# Flowise + Hermes Agent (gateway) en local.
# Démarrage : docker compose up -d
# Première configuration de Hermes (une seule fois) :
#   docker compose run --rm -it hermes setup
services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-stable}
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      # Exposé sur localhost uniquement : l'API pilote un agent avec outils.
      - "127.0.0.1:${HERMES_API_PORT:-8642}:8642"
      # Tableau de bord web de Hermes (connexion par identifiant / mot de passe du .env).
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      # Volume nommé (et non bind mount) : SQLite WAL est peu fiable sur
      # virtiofs avec Docker Desktop macOS.
      - hermes_data:/opt/data
      # Scripts des tâches cron « sans LLM » qui déclenchent des flows Flowise (Hermes ne les lit que dans /opt/data/scripts).
      - ./hermes/scripts:/opt/data/scripts:ro
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0" # nécessaire dans un conteneur
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY manquante, voir .env.example}
      # Utilisés par hermes/scripts/flowise_run.py (déclenchement planifié d'un flow).
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?HERMES_DASHBOARD_PASSWORD manquant, voir .env.example}
      FLOWISE_URL: http://flowise:3000
      FLOWISE_API_KEY: ${FLOWISE_API_KEY:-}

  flowise:
    # Image officielle + nœuds Hermes compilés (voir docker/flowise/Dockerfile).
    build:
      context: .
      dockerfile: docker/flowise/Dockerfile
      args:
        FLOWISE_IMAGE_TAG: ${FLOWISE_IMAGE_TAG:-3.1.3}
    image: flowise-hermes:local
    container_name: flowise
    restart: unless-stopped
    entrypoint: /bin/sh -c "sleep 3; flowise start"
    depends_on:
      - hermes
    ports:
      - "127.0.0.1:${FLOWISE_PORT:-3000}:3000"
    volumes:
      # L'image Flowise 3.1.3 tourne en root (HOME=/root) : ses données sont dans /root/.flowise,
      # pas /home/node/.flowise. Un montage ailleurs laisse la base dans la couche du conteneur,
      # effacée à chaque recréation (docker compose up --build).
      - flowise_data:/root/.flowise
    environment:
      PORT: "3000"
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRETKEY_OVERWRITE:?FLOWISE_SECRETKEY_OVERWRITE manquante, voir .env.example}
      SHOW_COMMUNITY_NODES: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hermes_data:
  flowise_data:
